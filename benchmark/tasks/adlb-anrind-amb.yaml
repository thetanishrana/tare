id: adlb-anrind-amb
benchmark_version: '0.1'
round: p1b
dataset: ADLB
target_vars:
- ANRIND
keys:
- USUBJID
- LBSEQ
therapeutic_area: core
variant: std
perturbation: none
oracle_id: std
inputs:
- name: lb_upstream
  source: oracle
  oracle_id: std
  dataset: adlb
  columns:
  - USUBJID
  - LBSEQ
  - PARAMCD
  - AVAL
  - ANRLO
  - ANRHI
rows:
  DTYPE: null
spec: specs/adlb-anrind-amb.md
output_contract:
  columns:
    USUBJID: string
    LBSEQ: number
    ANRIND: string
  allowed_values:
    ANRIND:
    - LOW
    - NORMAL
    - HIGH
  nullable:
  - ANRIND
difficulty: easy
error_categories_expected:
- missing-value
- window-boundary
- spec-misread
ambiguous: true
ambiguity_note: 'Results exactly at a limit, missing results, and results with no range are not covered.
  Escalation question: Is a result equal to a limit NORMAL, and what is ANRIND when AVAL is missing or
  the range is missing (null, or NORMAL)?'
split: dev
provenance: admiral 1.5.0 ADLB template; spec written by Tare
readings:
- id: limits-abnormal
  description: A result equal to a limit counts as outside the range (LOW at ANRLO, HIGH at ANRHI).
- id: no-range-normal
  description: A result with no range at all is NORMAL.
