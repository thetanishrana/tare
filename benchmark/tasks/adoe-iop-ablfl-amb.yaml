id: adoe-iop-ablfl-amb
benchmark_version: '0.1'
round: ho1
dataset: ADOE
target_vars:
- ABLFL
keys:
- USUBJID
- OESEQ
therapeutic_area: ophtha
variant: std
perturbation: none
oracle_id: oph
inputs:
- name: oe_upstream
  source: oracle
  oracle_id: oph
  dataset: adoe
  columns:
  - USUBJID
  - OESEQ
  - PARAMCD
  - OELAT
  - VISIT
  - OETPT
  - ADT
  - AVAL
  - TRTSDT
spec: specs/adoe-iop-ablfl-amb.md
output_contract:
  columns:
    USUBJID: string
    OESEQ: number
    ABLFL: string
  allowed_values:
    ABLFL:
    - Y
  nullable:
  - ABLFL
difficulty: medium
error_categories_expected:
- baseline-selection
- spec-misread
ambiguous: true
ambiguity_note: 'Whether baseline is chosen per eye or per subject and whether a measurement on the first
  dose day counts are not stated (post-dose measurements on that day are also not addressed, but they
  do not change the output on this data). Escalation question: Is baseline chosen separately for each
  eye, and does a pre-dose measurement on the first dose day count as before the first dose?'
split: heldout
provenance: base admiral functions on pharmaversesdtm ophthalmology data (r/ophtha.R); spec written by
  Tare
readings:
- id: pooled-eyes
  description: One baseline per subject and parameter across both eyes (the eye is ignored).
- id: strict-before
  description: A measurement on the first dose day is not before the first dose (ADT < TRTSDT).
