id: adlb-ontrtfl-amb
benchmark_version: '0.1'
round: p1a
dataset: ADLB
target_vars:
- ONTRTFL
keys:
- USUBJID
- LBSEQ
therapeutic_area: core
variant: std
perturbation: none
oracle_id: std
