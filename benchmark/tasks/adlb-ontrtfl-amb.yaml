  dose day count as on treatment?'
split: dev
provenance: admiral 1.5.0 ADLB template; spec written by Tare
readings:
- id: baseline-day-counts
  description: A Baseline-visit result on the first dose day is on treatment.
- id: dose-days-excluded
  description: The first and last dose days themselves are excluded (strictly between).
