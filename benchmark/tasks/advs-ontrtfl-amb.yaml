  - ONTRTFL
difficulty: medium
error_categories_expected:
- on-treatment-window
- boundary-day
- spec-misread
provenance: admiral 1.5.0 ADVS template; spec written by Tare
spec: specs/advs-ontrtfl-amb.md
ambiguous: true
ambiguity_note: 'It is not stated whether a measurement on the first dose day counts (in particular the
  baseline visit, which is taken before the first dose), whether the last dose day counts, or whether
  time after the last dose is on treatment. Escalation question: Do measurements on the first dose day,
  on the last dose day, or after the last dose count as on treatment, and is the baseline visit taken
  on the first dose day excluded?'
round: u1
split: unseen
readings:
- id: baseline-day-counts
  description: A measurement on the first dose day is on treatment, including the baseline visit (ADT
    on or after TRTSDT, nothing else excluded).
- id: last-day-excluded
  description: The last dose day is not on treatment (ADT before TRTEDT); the baseline visit on the first
    dose day is not on treatment.
- id: end-plus-30
  description: Measurements up to 30 days after the last dose date are on treatment; the baseline visit
    on the first dose day is not.
