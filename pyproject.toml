[project]
name = "tare-qc"
version = "0.0.1"
description = "Independent AI double programming for clinical trial datasets, and a measurement of when it fails."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "pyyaml",
    "pydantic",
    "openai",
    "anthropic",
    "python-dotenv",
    "typer",
    "rich",
    "matplotlib",
]

[project.scripts]
tare = "tare.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tare"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
