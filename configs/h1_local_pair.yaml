# First double-programming run on local models: qwen3-coder:30b (A) and gpt-oss:20b (B), both Python, gpt-oss:20b
# as adjudicator, no assumption check, prompt k2-v2 (optional ESCALATE reply). The 12 p1a tasks (6 ambiguous, 6 clear
# twins), 1 sample each. Free. Run with Tare's own Ollama server on port 11435 (16k context):
#   OLLAMA_HOST=127.0.0.1:11435 scripts/ollama_serve.sh   and   TARE_OLLAMA_URL=http://localhost:11435 tare run ...
name: h1_local_pair
mode: pair
programmer_a: {provider: ollama, model: "qwen3-coder:30b", language: python}
programmer_b: {provider: ollama, model: "gpt-oss:20b", language: python}
adjudicator: {provider: ollama, model: "gpt-oss:20b"}
reviewer: null
prompt_version: k2-v2
max_repairs: 2
samples: 1
params: {max_tokens: 8192, temperature: 0.2}
tasks:
- adsl-trtsdt-amb
- adsl-trtsdt-std
- adsl-eosstt-amb
- adsl-eosstt-std
- adae-astdt-amb
- adae-astdt-std
- adae-aoccifl-amb
- adae-aoccifl-std
- adlb-chg-amb
- adlb-chg-std
- adlb-ontrtfl-amb
- adlb-ontrtfl-std
